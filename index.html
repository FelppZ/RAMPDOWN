<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAMPDOWN</title>
    <link rel="icon" type="image/png" href="https://logosandtypes.com/wp-content/uploads/2025/05/MODEC-scaled.png">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        /* CONFIGURAÇÃO DE FONTES BAHNSCHRIFT */
        :root {
            --tech-black: #000000;
            --pure-white: #ffffff;
            --accent: #2563eb;
            --text-dark: #000000;
            --text-gray: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #f1f5f9;
            --font-bold: 'Bahnschrift SemiBold', 'Segoe UI', sans-serif;
            --font-light: 'Bahnschrift Light', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--pure-white); color: var(--text-dark); min-height: 100vh; font-family: var(--font-light); }

        /* HEADER ANIMADO PRETO */
        header {
            position: relative;
            background: var(--tech-black);
            height: 100px;
            display: flex;
            align-items: center;
            padding: 0 50px;
            overflow: hidden;
            z-index: 10;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.3; z-index: 1; }

        

        .header-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }

        .logo-section { display: flex; align-items: center; gap: 20px; }
        .logo-section img { height: 45px; }
        
        /* Linha vertical ao lado da logo */
        .v-line { width: 2px; height: 35px; background: rgba(255, 255, 255, 1); }

        /* Garante que os textos fiquem um embaixo do outro e centralizados com a logo */
.title-group {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.program-title {
    font-family: var(--font-bold);
    font-size: 1.4rem;
    color: #fff;
    line-height: 1; /* Reduz o espaço para o subtítulo chegar mais perto */
}

.subtitle {
    font-family: var(--font-light);
    font-size: 0.75rem;
    color: rgba(255, 255, 255, 0.6); /* Branco suave para não ofuscar o título */
    margin-top: 4px;
    letter-spacing: 0.5px;
}

        #sync-status { 
            font-family: var(--font-bold); 
            font-size: 0.7rem; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        .online { color: var(--success); } 
        .online .dot { background: var(--success); box-shadow: 0 0 10px var(--success); }

        /* DASHBOARD MINIMALISTA BRANCO */
        .container { max-width: 1300px; margin: 60px auto; padding: 0 40px; }

        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; }
        
        .card { 
            background: var(--pure-white); 
            padding: 35px; 
            border-radius: 20px; /* Cantos mais arredondados */
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); /* Sombra inicial leve */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* Transições suaves */
        }

        /* Animação ao passar o mouse */
        .card:hover {
            transform: translateY(-8px); /* Eleva o card */
            box-shadow: 0 12px 30px rgba(0,0,0,0.1); /* Sombra mais difusa e escura */
        }

        .card-title { 
            font-family: var(--font-bold); 
            font-size: 1.1rem; 
            color: var(--text-dark); 
            text-transform: uppercase;
            margin-bottom: 30px;
        }
                /* Estado Offline - Vermelho */
        .offline { color: var(--danger); }
        .offline .dot { 
            background: var(--danger); 
            box-shadow: 0 0 10px var(--danger); 
        }

        /* Estado Online - Verde */
        .online { color: var(--success); }
        .online .dot { 
            background: var(--success); 
            box-shadow: 0 0 10px var(--success); 
        }
        .percentage { 
            font-family: var(--font-bold); 
            font-size: 4.5rem; 
            line-height: 1; 
            margin-bottom: 10px;
        }

        .value-text { 
            font-family: var(--font-light); 
            font-size: 1rem; 
            color: var(--text-gray); 
            margin-bottom: 20px;
        }
        .value-text strong { font-family: var(--font-bold); color: var(--text-dark); }

        .bar-container { background: #f8fafc; height: 6px; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 1.5s cubic-bezier(0.1, 0, 0, 1); }

        /* EDITOR E ACESSO */
        .admin-trigger {
            position: fixed;
            bottom: 30px; right: 30px;
            background: var(--tech-black);
            color: white; width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; opacity: 0.5; transition: 0.3s;
        }
        .admin-trigger:hover { opacity: 1; }

        .editor-panel { 
            display: none; 
            margin-top: 60px; padding: 40px; 
            background: #fafafa; border: 1px solid #eee;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            border-radius: 15px;
        }
        .editor-panel h2 { font-family: var(--font-bold); margin-bottom: 25px; }

        .inputs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .input-group label { font-family: var(--font-bold); font-size: 0.75rem; text-transform: uppercase; display: block; margin-bottom: 8px; }
        
        input { 
            font-family: var(--font-bold); 
            padding: 12px; border: 1px solid #ddd; 
            border-radius: 4px; width: 100%; outline: none; 
        }

        .btn-sync { 
            background: var(--tech-black); color: white; border: none; 
            padding: 20px; font-family: var(--font-bold); 
            cursor: pointer; width: 100%; margin-top: 30px; text-transform: uppercase;
            border-radius: 8px;
        }
        .btn-sync.saved { background: var(--success); }

    </style>
</head>
<body>

<header>
    <canvas id="bg-canvas"></canvas>
    <div class="header-content">
        <div class="logo-section">
            <img src="https://i0.wp.com/gcci.gy/wp-content/uploads/2025/01/logo-MODEC-1-Faneeza-Karim.png?ssl=1" alt="Logo">
            <div class="v-line"></div>
            <div class="title-group">
        <div class="program-title">RAMPDOWN DASHBOARD</div>
        <div class="subtitle">KPI Monitoring System • BETA</div>
    </div>
</div>
        <div id="sync-status" class="offline">
            <div class="dot"></div> <span id="status-text">STATUS: OFF</span>
        </div>
    </div>
</header>

<div class="container">
    <div class="kpi-grid">
        <div class="card">
            <div class="card-title">OATS</div>
            <div class="percentage" id="p-OATS">0%</div>
            <div class="value-text">COMPLETED: <strong id="v-OATS">0 / 0</strong></div>
            <div class="bar-container"><div id="b-OATS" class="bar-fill"></div></div>
        </div>

        <div class="card">
            <div class="card-title">SCE</div>
            <div class="percentage" id="p-SCE">0%</div>
            <div class="value-text">COMPLETED: <strong id="v-SCE">0 / 0</strong></div>
            <div class="bar-container"><div id="b-SCE" class="bar-fill"></div></div>
        </div>

        <div class="card">
            <div class="card-title">CRIT #1</div>
            <div class="percentage" id="p-CRIT1">0%</div>
            <div class="value-text">COMPLETED: <strong id="v-CRIT1">0 / 0</strong></div>
            <div class="bar-container"><div id="b-CRIT1" class="bar-fill"></div></div>
        </div>
    </div>

    <div class="editor-panel" id="editor-panel">
        <h2>UPDATE</h2>
        <div class="inputs-grid">
            <div class="input-group">
                <label>OATS (Atual / Max)</label>
                <div style="display:flex; gap:10px;"><input type="number" id="in-OATS-cur"><input type="number" id="in-OATS-max"></div>
            </div>
            <div class="input-group">
                <label>SCE (Atual / Max)</label>
                <div style="display:flex; gap:10px;"><input type="number" id="in-SCE-cur"><input type="number" id="in-SCE-max"></div>
            </div>
            <div class="input-group">
                <label>CRIT 1 (Atual / Max)</label>
                <div style="display:flex; gap:10px;"><input type="number" id="in-CRIT1-cur"><input type="number" id="in-CRIT1-max"></div>
            </div>
        </div>
        <button class="btn-sync" id="btn-save" onclick="sendToCloud()">Atualizar Base de Dados</button>
    </div>
</div>

<div class="admin-trigger" onclick="checkPass()">🔒</div>

<script>
    // --- FIREBASE CONFIG (Substitua pelos seus dados) ---
    const firebaseConfig = {
  apiKey: "AIzaSyDpowacZTDw8AiOQFK1SOY85x8LyNk1088",
  authDomain: "rampdown-data.firebaseapp.com",
  projectId: "rampdown-data",
  storageBucket: "rampdown-data.firebasestorage.app",
  messagingSenderId: "971612677227",
  appId: "1:971612677227:web:74c155f0d5092b96913d2e",
  measurementId: "G-1DJKW5797D"
};

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const kpis = ['OATS', 'SCE', 'CRIT1'];

    // 1. ANIMAÇÃO HEADER
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let pts = [];
    function init() {
        canvas.width = window.innerWidth; canvas.height = 100;
        pts = [];
        for(let i=0; i<30; i++) pts.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: 0.2, vy: 0.2});
    }
    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#fff"; ctx.strokeStyle = "rgba(255,255,255,0.1)";
        pts.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            if(p.x > canvas.width) p.x = 0; if(p.y > canvas.height) p.y = 0;
            ctx.beginPath(); ctx.arc(p.x, p.y, 1, 0, Math.PI*2); ctx.fill();
            pts.forEach(p2 => {
                let d = Math.hypot(p.x-p2.x, p.y-p2.y);
                if(d < 150) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
            });
        });
        requestAnimationFrame(draw);
    }
    init(); draw();

    // 2. SENHA
    function checkPass() {
        if(prompt("Senha:") === "Fab222324") {
            document.getElementById('editor-panel').style.display = 'block';
            window.scrollTo(0, document.body.scrollHeight);
        }
    }

    // 3. FIREBASE SYNC
    // Monitor de Conexão em Tempo Real
db.ref(".info/connected").on("value", (snap) => {
    const statusDiv = document.getElementById('sync-status');
    const statusText = document.getElementById('status-text');

    if (snap.val() === true) {
        // Se a conexão for bem-sucedida
        statusDiv.classList.remove('offline');
        statusDiv.classList.add('online');
        statusText.textContent = 'STATUS: ONLINE';
    } else {
        // Se a conexão cair ou ainda não tiver ocorrido
        statusDiv.classList.remove('online');
        statusDiv.classList.add('offline');
        statusText.textContent = 'STATUS: CONNECTING';
    }
});

    db.ref('dashboard_live').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            kpis.forEach(id => {
                const cur = Number(data[id]?.cur || 0);
                const max = Number(data[id]?.max || 0);
                const pct = max > 0 ? (cur / max) * 100 : 0;
                document.getElementById(`v-${id}`).textContent = `${cur} / ${max}`;
                document.getElementById(`p-${id}`).textContent = `${Math.floor(pct)}%`;
                const bar = document.getElementById(`b-${id}`);
                bar.style.width = Math.min(pct, 100) + "%";
                bar.style.backgroundColor = pct < 50 ? 'var(--danger)' : pct < 85 ? 'var(--warning)' : 'var(--success)';
                document.getElementById(`p-${id}`).style.color = bar.style.backgroundColor;
                if (document.activeElement.id !== `in-${id}-cur`) document.getElementById(`in-${id}-cur`).value = cur;
                if (document.activeElement.id !== `in-${id}-max`) document.getElementById(`in-${id}-max`).value = max;
            });
        }
    });

    function sendToCloud() {
        const payload = {};
        kpis.forEach(id => {
            payload[id] = {
                cur: Number(document.getElementById(`in-${id}-cur`).value) || 0,
                max: Number(document.getElementById(`in-${id}-max`).value) || 0
            };
        });
        db.ref('dashboard_live').set(payload).then(() => {
            const b = document.getElementById('btn-save');
            b.classList.add('saved'); b.textContent = "BASE ATUALIZADA";
            setTimeout(() => { b.classList.remove('saved'); b.textContent = "Atualizar Base de Dados"; }, 2000);
        });
    }
</script>
</body>
</html>
