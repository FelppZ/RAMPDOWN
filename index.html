<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAMPDOWN // CORE SYSTEM</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text-main); padding: 20px; }

        .container { max-width: 1100px; margin: 0 auto; }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        #sync-status { font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
        .online { color: var(--success); }
        .online .dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .offline { color: var(--danger); }
        .offline .dot { background: var(--danger); }

        /* Dashboard */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
        .label { color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .percentage { font-size: 2.5rem; font-weight: 800; display: block; margin: 10px 0; }
        .value-text { font-size: 0.9rem; color: var(--text-dim); }
        .value-text strong { color: var(--text-main); }
        
        .bar-container { background: #334155; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 15px; }
        .bar-fill { height: 100%; width: 0%; transition: width 1s ease-in-out, background-color 0.5s; }

        /* Editor */
        .editor-panel { margin-top: 40px; background: #00000044; padding: 30px; border-radius: 16px; border: 1px dashed var(--border); }
        .inputs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-pair { display: flex; gap: 10px; }
        input { background: #1e293b; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; }
        input:focus { border-color: var(--primary); }

        .btn-sync { 
            background: var(--primary); color: white; border: none; padding: 18px; border-radius: 8px; 
            font-weight: 700; cursor: pointer; width: 100%; margin-top: 25px; transition: 0.3s;
        }
        .btn-sync:disabled { opacity: 0.5; }
        .btn-sync.success { background: var(--success); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 style="color: var(--primary); font-size: 1.2rem;">RAMPDOWN // LIVE</h1>
        <div id="sync-status" class="offline">
            <div class="dot"></div> <span id="status-text">DESCONECTADO</span>
        </div>
    </header>

    <div class="kpi-grid">
        <div class="card">
            <span class="label">Eficiência OATS</span>
            <span class="percentage" id="p-OATS">0%</span>
            <span class="value-text">Prod: <strong id="v-OATS">0 / 0</strong></span>
            <div class="bar-container"><div id="b-OATS" class="bar-fill"></div></div>
        </div>
        <div class="card">
            <span class="label">Ciclo SCE</span>
            <span class="percentage" id="p-SCE">0%</span>
            <span class="value-text">Prod: <strong id="v-SCE">0 / 0</strong></span>
            <div class="bar-container"><div id="b-SCE" class="bar-fill"></div></div>
        </div>
        <div class="card">
            <span class="label">Fator Crítico</span>
            <span class="percentage" id="p-CRIT1">0%</span>
            <span class="value-text">Prod: <strong id="v-CRIT1">0 / 0</strong></span>
            <div class="bar-container"><div id="b-CRIT1" class="bar-fill"></div></div>
        </div>
    </div>

    <div class="editor-panel">
        <span class="label" style="color: var(--primary);">Console de Comando</span>
        <div class="inputs-grid">
            <div class="input-group">
                <span class="label">OATS (Atu / Max)</span>
                <div class="input-pair">
                    <input type="number" id="in-OATS-cur" placeholder="0">
                    <input type="number" id="in-OATS-max" placeholder="0">
                </div>
            </div>
            <div class="input-group">
                <span class="label">SCE (Atu / Max)</span>
                <div class="input-pair">
                    <input type="number" id="in-SCE-cur" placeholder="0">
                    <input type="number" id="in-SCE-max" placeholder="0">
                </div>
            </div>
            <div class="input-group">
                <span class="label">CRIT 1 (Atu / Max)</span>
                <div class="input-pair">
                    <input type="number" id="in-CRIT1-cur" placeholder="0">
                    <input type="number" id="in-CRIT1-max" placeholder="0">
                </div>
            </div>
        </div>
        <button class="btn-sync" id="btn-save" onclick="sendToCloud()">SINCRONIZAR DADOS</button>
    </div>
</div>

<script>
    // --- COLOQUE SUAS CHAVES AQUI ---
    const firebaseConfig = {
  apiKey: "AIzaSyDpowacZTDw8AiOQFK1SOY85x8LyNk1088",
  authDomain: "rampdown-data.firebaseapp.com",
  projectId: "rampdown-data",
  storageBucket: "rampdown-data.firebasestorage.app",
  messagingSenderId: "971612677227",
  appId: "1:971612677227:web:74c155f0d5092b96913d2e",
  measurementId: "G-1DJKW5797D"
};

    // Inicialização
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const kpis = ['OATS', 'SCE', 'CRIT1'];

    // Monitor de Conexão
    db.ref(".info/connected").on("value", (snap) => {
        const statusDiv = document.getElementById('sync-status');
        const statusText = document.getElementById('status-text');
        if (snap.val() === true) {
            statusDiv.className = 'online'; statusText.textContent = 'CONECTADO AO FIREBASE';
        } else {
            statusDiv.className = 'offline'; statusText.textContent = 'ERRO DE CONEXÃO';
        }
    });

    // Receber dados em tempo real
    db.ref('dashboard_live').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            kpis.forEach(id => {
                const cur = Number(data[id]?.cur || 0);
                const max = Number(data[id]?.max || 0);
                const pct = max > 0 ? (cur / max) * 100 : 0;

                document.getElementById(`v-${id}`).textContent = `${cur} / ${max}`;
                document.getElementById(`p-${id}`).textContent = `${Math.floor(pct)}%`;
                
                const bar = document.getElementById(`b-${id}`);
                bar.style.width = Math.min(pct, 100) + "%";
                const color = pct < 50 ? '#ef4444' : pct < 85 ? '#f59e0b' : '#10b981';
                bar.style.backgroundColor = color;
                document.getElementById(`p-${id}`).style.color = color;

                // Sincroniza inputs se não estiverem em foco
                if (document.activeElement !== document.getElementById(`in-${id}-cur`)) 
                    document.getElementById(`in-${id}-cur`).value = cur;
                if (document.activeElement !== document.getElementById(`in-${id}-max`)) 
                    document.getElementById(`in-${id}-max`).value = max;
            });
        }
    });

    // Enviar dados
    function sendToCloud() {
        const btn = document.getElementById('btn-save');
        const payload = {};
        kpis.forEach(id => {
            payload[id] = {
                cur: Number(document.getElementById(`in-${id}-cur`).value) || 0,
                max: Number(document.getElementById(`in-${id}-max`).value) || 0
            };
        });

        btn.disabled = true; btn.textContent = "ENVIANDO...";
        db.ref('dashboard_live').set(payload)
            .then(() => {
                btn.disabled = false; btn.classList.add('success'); btn.textContent = "SUCESSO!";
                setTimeout(() => { btn.classList.remove('success'); btn.textContent = "SINCRONIZAR DADOS"; }, 2000);
            })
            .catch(err => {
                btn.disabled = false; alert("Erro ao salvar: " + err.message);
                btn.textContent = "TENTAR NOVAMENTE";
            });
    }
</script>

</body>
</html>
