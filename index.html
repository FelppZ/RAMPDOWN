<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAMPDOWN DASHBOARD</title>
    <link rel="icon" type="image/png" href="https://logosandtypes.com/wp-content/uploads/2025/05/MODEC-scaled.png">
    
    <!-- Scripts Firebase e Gráficos -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --tech-black: #000000;
            --pure-white: #ffffff;
            --accent: #2563eb;
            --text-dark: #000000;
            --text-gray: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #f1f5f9;
            --font-bold: 'Bahnschrift SemiBold', 'Segoe UI', sans-serif;
            --font-light: 'Bahnschrift Light', 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fcfcfc; color: var(--text-dark); min-height: 100vh; font-family: var(--font-light); }

        header {
            position: relative;
            background: var(--tech-black);
            height: 100px;
            display: flex;
            align-items: center;
            padding: 0 50px;
            overflow: hidden;
            z-index: 10;
        }
        #bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.3; z-index: 1; }
        .header-content { position: relative; z-index: 2; display: flex; justify-content: space-between; width: 100%; align-items: center; }
        .logo-section { display: flex; align-items: center; gap: 20px; }
        .logo-section img { height: 45px; }
        .v-line { width: 2px; height: 35px; background: #fff; }
        .program-title { font-family: var(--font-bold); font-size: 1.4rem; color: #fff; line-height: 1; }
        .subtitle { font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); margin-top: 4px; letter-spacing: 0.5px; }
        
        #sync-status { font-family: var(--font-bold); font-size: 0.7rem; display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        .online { color: var(--success); } .online .dot { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .offline { color: var(--danger); } .offline .dot { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

        .container { max-width: 1300px; margin: 40px auto; padding: 0 40px; }
        .section-results-title { 
            font-family: var(--font-bold); font-size: 1.6rem; color: #1a1a1a; 
            text-transform: uppercase; letter-spacing: 4px; margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;
        }

        .kpi-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 30px; 
            align-items: start;
        }

        .card { 
            position: relative; 
            background: var(--pure-white); 
            padding: 35px; 
            border-radius: 20px; 
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }

        .card-button {
            position: absolute; top: 25px; right: 20px; z-index: 10;
            padding: 6px 12px; background: #fff; border: 1.5px solid #000;
            border-radius: 6px; font-family: var(--font-bold); font-size: 0.65rem;
            cursor: pointer; transition: all 0.3s ease;
        }
        .card-button:hover { background: #000; color: #fff; }

        .percentage { font-family: var(--font-bold); font-size: 4.5rem; line-height: 1; margin-bottom: 10px; transition: color 0.5s ease; }
        .value-text { color: var(--text-gray); margin-bottom: 20px; font-size: 0.95rem; }
        .bar-container { background: #f8fafc; height: 8px; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; transition: width 1.5s cubic-bezier(0.1, 0, 0, 1), background-color 0.5s ease; }

        .card-extra { 
            max-height: 0; opacity: 0; overflow: hidden; 
            transition: max-height 0.6s cubic-bezier(0, 1, 0, 1), opacity 0.3s ease; 
        }
        .card.expanded .card-extra { 
            max-height: 300px; opacity: 1; margin-top: 20px; 
            padding-top: 20px; border-top: 2px #eee; 
        }
        .chart-container { height: 130px; width: 100%; }

        .card-title { 
            font-family: var(--font-bold); 
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: var(--text-dark); 
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        
        .editor-panel { 
            display: none; margin-top: 60px; padding: 40px; 
            background: #ffffff; border: 1px solid #e2e8f0;
            border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }
        .editor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .input-group { background: #f8fafc; padding: 20px; border-radius: 12px; }
        .input-group label { font-family: var(--font-bold); font-size: 0.7rem; color: var(--text-gray); display: block; margin-bottom: 10px; text-transform: uppercase; }
        .input-pair { display: flex; gap: 10px; }
        input[type="number"] { 
            padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; 
            width: 100%; font-family: var(--font-bold); outline: none; 
        }
        input:focus { border-color: var(--accent); }
        .btn-sync { 
            background: var(--tech-black); color: white; border: none; padding: 20px; 
            font-family: var(--font-bold); cursor: pointer; width: 100%; margin-top: 30px; 
            text-transform: uppercase; border-radius: 12px; transition: 0.3s;
        }
        .btn-sync.saved { background: var(--success); }

        .admin-trigger { position: fixed; bottom: 30px; right: 30px; background: #000; color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0.4; z-index: 100; transition: 0.3s; }
        .admin-trigger:hover { opacity: 1; }
    </style>
</head>
<body>

<header>
    <canvas id="bg-canvas"></canvas>
    <div class="header-content">
        <div class="logo-section">
            <img src="https://i0.wp.com/gcci.gy/wp-content/uploads/2025/01/logo-MODEC-1-Faneeza-Karim.png?ssl=1" alt="Logo">
            <div class="v-line"></div>
            <div class="title-group">
                <div class="program-title">RAMPDOWN DASHBOARD</div>
                <div class="subtitle">KPI Monitoring System • BETA</div>
            </div>
        </div>
        <div id="sync-status" class="offline">
            <div class="dot"></div> <span id="status-text">STATUS: CONNECTING</span>
        </div>
    </div>
</header>

<main class="container">
    <h1 id="main-results-title" class="section-results-title">LOADING RESULTS</h1>

    <div class="kpi-grid">
        <!-- OATS -->
        <div class="card" id="card-oats">
            <button class="card-button" onclick="expandir('card-oats')">DETAILS</button>
            <div class="card-title">OATS</div>
            <div class="percentage" id="p-OATS">0%</div>
            <div class="value-text">COMPLETED: <strong id="v-OATS">0 / 0</strong></div>
            <div class="bar-container"><div id="b-OATS" class="bar-fill"></div></div>
            <div class="card-extra">
                <div class="chart-container"><canvas id="chart-oats"></canvas></div>
            </div>
        </div>

        <!-- SCE -->
        <div class="card" id="card-sce">
            <button class="card-button" onclick="expandir('card-sce')">DETAILS</button>
            <div class="card-title">SCE</div>
            <div class="percentage" id="p-SCE">0%</div>
            <div class="value-text">COMPLETED: <strong id="v-SCE">0 / 0</strong></div>
            <div class="bar-container"><div id="b-SCE" class="bar-fill"></div></div>
            <div class="card-extra">
                <div class="chart-container"><canvas id="chart-sce"></canvas></div>
            </div>
        </div>

        <!-- CRIT #1 -->
        <div class="card" id="card-crit1">
            <button class="card-button" onclick="expandir('card-crit1')">DETAILS</button>
            <div class="card-title">CRIT #1</div>
            <div class="percentage" id="p-CRIT1">0%</div>
            <div class="value-text">COMPLETED: <strong id="v-CRIT1">0 / 0</strong></div>
            <div class="bar-container"><div id="b-CRIT1" class="bar-fill"></div></div>
            <div class="card-extra">
                <div class="chart-container"><canvas id="chart-crit1"></canvas></div>
            </div>
        </div>
    </div>

    <!-- PAINEL EDITOR -->
    <div class="editor-panel" id="editor-panel">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:15px;">
            <h2 style="font-family:var(--font-bold);">UPDATE SYSTEM</h2>
            <button id="btn-close-editor" class="card-button" onclick="closeEditor()" style="position:static; padding:8px 14px;">
                CLOSE
            </button>
        </div>
        <div class="editor-grid">
            <div class="input-group">
                <label>OATS (Atual / Max)</label>
                <div class="input-pair"><input type="number" id="in-OATS-cur"><input type="number" id="in-OATS-max"></div>
            </div>
            <div class="input-group">
                <label>SCE (Atual / Max)</label>
                <div class="input-pair"><input type="number" id="in-SCE-cur"><input type="number" id="in-SCE-max"></div>
            </div>
            <div class="input-group">
                <label>CRIT 1 (Atual / Max)</label>
                <div class="input-pair"><input type="number" id="in-CRIT1-cur"><input type="number" id="in-CRIT1-max"></div>
            </div>
        </div>
        <button class="btn-sync" id="btn-save" onclick="sendToCloud()">Atualizar Base de Dados</button>
    </div>
</main>

<div class="admin-trigger" onclick="checkPass()">🔒</div>

<script>
    // --- CONFIG FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyDpowacZTDw8AiOQFK1SOY85x8LyNk1088",
        authDomain: "rampdown-data.firebaseapp.com",
        projectId: "rampdown-data",
        databaseURL: "https://rampdown-data-default-rtdb.firebaseio.com",
        storageBucket: "rampdown-data.firebasestorage.app",
        messagingSenderId: "971612677227",
        appId: "1:971612677227:web:74c155f0d5092b96913d2e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const kpis = ['OATS', 'SCE', 'CRIT1'];
    const chartInstances = {};

    // Stores para tooltip
    const currentMaxByKpi = { OATS: 0, SCE: 0, CRIT1: 0 };
    const currentCurByKpi = { OATS: 0, SCE: 0, CRIT1: 0 };

    // Helpers
    const toYMD = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const fmtLabel = (ts) => {
        const d = new Date(ts);
        const dd = String(d.getDate()).padStart(2,'0');
        const mm = String(d.getMonth()+1).padStart(2,'0');
        const yyyy = d.getFullYear();
        const hh = String(d.getHours()).padStart(2,'0');
        const mi = String(d.getMinutes()).padStart(2,'0');
        return `${dd}/${mm}/${yyyy} ${hh}:${mi}`;
    };

    // --- GRÁFICOS ---
    function initChart(id, label, color) {
        const ctx = document.getElementById(id).getContext('2d');
        chartInstances[id] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label,
                        data: [],
                        borderColor: color,
                        borderWidth: 2,
                        fill: false,
                        tension: 0.45,
                        cubicInterpolationMode: 'monotone',
                        pointRadius: 2,
                        pointHoverRadius: 5,
                        pointHitRadius: 10,
                        pointBackgroundColor: color,
                        pointBorderColor: color,
                        clip: 10
                    },
                    {
                        label: 'META 100%',
                        data: [],
                        borderColor: 'rgba(0,0,0,0.35)',
                        borderWidth: 1.5,
                        borderDash: [6, 4],
                        pointRadius: 0,
                        fill: false,
                        tension: 0,
                        hoverRadius: 0,
                        hitRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 8, bottom: 4 } },
                animation: { duration: 900, easing: 'easeInOutCubic' },
                interaction: { mode: 'nearest', intersect: true, axis: 'x' },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        enabled: true,
                        position: 'nearest',
                        intersect: true,
                        filter: (item) => item.datasetIndex === 0,
                        callbacks: {
                            title: (items) => items[0]?.label || '',
                            label: (ctx) => {
                              const chart = ctx.chart;
                              const pct = Math.round(ctx.parsed.y);
                              const curSeries = chart.$curSeries || [];
                              const curAtPoint = curSeries[ctx.dataIndex] ?? 0;
                              return `${pct}% | ${curAtPoint}`;
                          }
                        }
                    }
                },
                hover: { mode: 'nearest', intersect: true },
                elements: { line: { capBezierPoints: true } },
                scales: {
                    x: { display: false },
                    y: { display: false, min: 0, max: 105, grace: '2%' }
                }
            }
        });
    }

    // --- EXPANDIR ---
    function expandir(id) {
        const card = document.getElementById(id);
        const btn = card.querySelector('.card-button');
        card.classList.toggle('expanded');
        btn.textContent = card.classList.contains('expanded') ? "CLOSE" : "DETAILS";
    }

    // --- STATUS ---
    db.ref(".info/connected").on("value", (snap) => {
        const statusDiv = document.getElementById('sync-status');
        const statusText = document.getElementById('status-text');
        if (snap.val() === true) {
            statusDiv.className = 'online'; statusText.textContent = 'STATUS: ONLINE';
        } else {
            statusDiv.className = 'offline'; statusText.textContent = 'STATUS: CONNECTING';
        }
    });

    // --- ESCRITA DE EVENTOS: toda mudança vira um evento diário ---
    async function writeEventIfChanged(id, cur, max, pct) {
        // Evitar duplicado exato imediato: compara com último evento do dia
        const dayKey = toYMD(new Date());
        const lastSnap = await db.ref(`dashboard_events/${id}/${dayKey}`).limitToLast(1).once('value');
        let equal = false;
        if (lastSnap.exists()) {
            const last = Object.values(lastSnap.val())[0] || {};
            if (Number(last.cur) === cur && Number(last.max) === max && Number(last.pct) === pct) {
                equal = true;
            }
        }
        if (!equal) {
            const ts = Date.now();
            await db.ref(`dashboard_events/${id}/${dayKey}`).push({ cur, max, pct, ts });
        }
    }

    // --- ATUALIZAÇÃO LIVE + gravação de eventos ---
    db.ref('dashboard_live').on('value', async (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        for (const id of kpis) {
            const cur = Number(data[id]?.cur || 0);
            const max = Number(data[id]?.max || 1);
            const pct = Math.floor((cur / max) * 100);

            // UI
            const color = pct < 50 ? 'var(--danger)' : pct < 85 ? 'var(--warning)' : 'var(--success)';
            document.getElementById(`v-${id}`).textContent = `${cur} / ${max}`;
            document.getElementById(`p-${id}`).textContent = `${pct}%`;
            document.getElementById(`p-${id}`).style.color = color;
            const bar = document.getElementById(`b-${id}`);
            bar.style.width = Math.min(pct, 100) + "%";
            bar.style.backgroundColor = color;

            const inCur = document.getElementById(`in-${id}-cur`);
            const inMax = document.getElementById(`in-${id}-max`);
            if (document.activeElement !== inCur) inCur.value = cur;
            if (document.activeElement !== inMax) inMax.value = max;

            currentMaxByKpi[id] = max;
            currentCurByKpi[id] = cur;

            // EVENTO do dia
            await writeEventIfChanged(id, cur, max, pct);
        }
    });

    // --- LER eventos dos últimos 7 dias e alimentar os gráficos ---
    const DAYS_BACK = 7; // ajuste conforme necessário
    function getLastDaysKeys(n) {
        const out = [];
        const now = new Date();
        for (let i = n - 1; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
            out.push(toYMD(d));
        }
        return out;
    }

    kpis.forEach(id => {
        const cId = `chart-${id.toLowerCase()}`;
        // Escuta o nó raiz dos eventos do KPI
        db.ref(`dashboard_events/${id}`).on('value', snap => {
            const allDays = snap.val() || {};
            if (!chartInstances[cId]) return;

            // Seleciona apenas os últimos N dias
            const wanted = new Set(getLastDaysKeys(DAYS_BACK));
            const merged = [];

            Object.entries(allDays).forEach(([day, events]) => {
                if (!wanted.has(day)) return;
                const arr = Object.values(events || {});
                merged.push(...arr);
            });

            // Ordena por timestamp
            merged.sort((a, b) => Number(a.ts || 0) - Number(b.ts || 0));

            // Monta labels e dados
            const labels = merged.map(e => fmtLabel(e.ts || Date.now()));
const data = merged.map(e => Number(e.pct || 0));
const curSeries = merged.map(e => Number(e.cur || 0)); // série histórica de "cur" ponto a ponto

const chart = chartInstances[cId];
chart.data.labels = labels;
chart.data.datasets[0].data = data;
chart.data.datasets[1].data = Array(labels.length).fill(100);

// Guarda a série de "cur" histórica no próprio chart
chart.$curSeries = curSeries;

chart.update({ duration: 600, easing: 'easeInOutCubic' });
        });
    });

    // --- ENVIAR DADOS (mantém histórico_condicional legacy, opcional) ---
    function sendToCloud() {
        const payload = {};
        const historyOps = [];

        kpis.forEach(id => {
            const cur = Number(document.getElementById(`in-${id}-cur`).value) || 0;
            const max = Number(document.getElementById(`in-${id}-max`).value) || 0;
            const pct = max > 0 ? Math.floor((cur / max) * 100) : 0;

            payload[id] = { cur, max };

            // Histórico legacy (pode remover se quiser somente events diários)
            const histRef = db.ref(`dashboard_history/${id}`).limitToLast(1);
            const op = histRef.once('value').then(snap => {
                let shouldPush = true;
                if (snap.exists()) {
                    const last = Object.values(snap.val())[0] || {};
                    if (Number(last.cur) === cur && Number(last.max) === max && Number(last.pct) === pct) shouldPush = false;
                }
                if (shouldPush) {
                    const ts = Date.now();
                    return db.ref(`dashboard_history/${id}`).push({ cur, max, pct, ts });
                }
                return Promise.resolve();
            });
            historyOps.push(op);
        });

        db.ref('dashboard_live').set(payload)
            .then(() => Promise.all(historyOps))
            .then(() => {
                const b = document.getElementById('btn-save');
                b.classList.add('saved'); b.textContent = "SUCESSO!";
                setTimeout(() => { b.classList.remove('saved'); b.textContent = "Atualizar Base de Dados"; }, 2000);
            })
            .catch(err => {
                console.error('Erro ao atualizar:', err);
                alert('Erro ao atualizar a base de dados/histórico.');
            });
    }

    // --- HEADER WAVES ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let count = 0;

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = 100;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerY = canvas.height / 2;
        const color = "rgba(36, 80, 255, 1)";
        const waves = [
            { amplitude: Math.max(34, canvas.height * 0.09), frequency: 0.0046, phase: 0,                 lineWidth: 2.8 },
            { amplitude: Math.max(28, canvas.height * 0.08), frequency: 0.0062, phase: Math.PI / 2.6,     lineWidth: 2.6 },
            { amplitude: Math.max(22, canvas.height * 0.07), frequency: 0.0042, phase: Math.PI / 1.6,     lineWidth: 2.4 }
        ];
        for (const w of waves) {
            ctx.beginPath();
            ctx.lineWidth = w.lineWidth;
            ctx.strokeStyle = color;
            const step = 1;
            for (let x = 0; x < canvas.width; x += step) {
                const y = centerY + Math.sin(x * w.frequency + count + w.phase) * w.amplitude;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        const fadePad = 480;
        const fadeWidth = Math.min(80, canvas.width * 0.10);
        ctx.save();
        ctx.globalCompositeOperation = 'destination-in';
        const fade = ctx.createLinearGradient(fadePad, 0, fadePad + fadeWidth, 0);
        fade.addColorStop(0.00, 'rgba(0,0,0,0)');
        fade.addColorStop(0.50, 'rgba(0,0,0,0.35)');
        fade.addColorStop(0.85, 'rgba(0,0,0,0.85)');
        fade.addColorStop(1.00, 'rgba(0,0,0,1)');
        ctx.fillStyle = fade;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();

        count += 0.01;
        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', init);
    init();
    draw();

    // --- ADMIN / EDITOR ---
    function checkPass() {
        if (prompt("Senha:") === "222324") {
            openEditor();
        }
    }
    function openEditor() {
        const panel = document.getElementById('editor-panel');
        panel.style.display = 'block';
        window.scrollTo({ top: panel.offsetTop - 20, behavior: 'smooth' });
    }
    function closeEditor() {
        const panel = document.getElementById('editor-panel');
        panel.style.display = 'none';
    }

    window.onload = () => {
        init(); draw();
        const meses = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
        document.getElementById('main-results-title').textContent = `${meses[new Date().getMonth()]} RESULTS`;
        
        initChart('chart-oats', 'OATS', '#2563eb');
        initChart('chart-sce', 'SCE', '#10b981');
        initChart('chart-crit1', 'CRIT', '#f59e0b');
    };
</script>
</body>
</html>
